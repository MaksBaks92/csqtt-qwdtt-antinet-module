name: Release module bundles

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: examples/moduledual/native/dual/go.sum

      - name: Go helper tests
        run: python build.py --test --module dual -y

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27d

      - name: Build Android ABIs
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: python build.py --os android --module dual --abis all -y

      - name: Build Linux desktop helper
        run: python build.py --os linux --module dual --arch amd64 -y

      - name: Bundle release zips + manifest skeleton
        run: python build.py --bundle --module dual

      - name: Upload dist-release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dual-dist-release
          path: examples/moduledual/dist-release/
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          overwrite_files: true
          fail_on_unmatched_files: false
          body: |
            Dual AntiNet module — one helper, two protocols (`csqtt://` + `qwdtt://` / `wdtt://`).
            One active LINK per session (AntiNet multi-scheme); both schemes ship in the same zip.
            qWDTT: WireGuard (`vpn`) and Raw IP (`rawtun`, needs `-listen-raw` on VPS).
            License: GPL-3.0-or-later for the combined helper — see NOTICE.
          files: |
            examples/moduledual/dist-release/*.zip
            examples/moduledual/dist-release/antinet-module.json
